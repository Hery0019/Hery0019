name: Refresh the contribution grid

on:
  schedule:
    # Once a day, a little after midnight UTC.
    - cron: "17 0 * * *"
  workflow_dispatch:

# No push trigger on purpose: this job commits to main, and a push trigger would
# make it retrigger itself. Once a day is plenty for a contribution grid.

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Redraw the grid into README.md
        run: node scripts/contributions.mjs ${{ github.repository_owner }} README.md

      - name: Commit when it changed
        run: |
          if git diff --quiet -- README.md; then
            echo "nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Refresh the contribution grid [skip ci]"
          git push
