name: Generate Snake Animation

on:
  schedule:
    # Every 12 hours
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # The colours match the README banner: a warm amber snake over a dark grey ramp,
      # so the contribution grid reads as part of the same terminal.
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23B87514&color_dots=%23EDEDED,%23F2DDB4,%23E8A33D,%23A9701E,%2308090B
            dist/github-contribution-grid-snake-dark.svg?color_snake=%23E8A33D&color_dots=%2311161C,%232E2A22,%23735311,%23B87514,%23E8A33D

      - name: Push SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
