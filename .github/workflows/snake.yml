name: Generate Snake Animation

on:
  schedule:
    # Every 12 hours
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # One file, not a light/dark pair. <picture> picks a source by theme and
      # never falls back to <img> when that source fails to load, so a second
      # URL is a second way for the grid to vanish entirely. Empty cells are
      # fully transparent and the levels are the banner amber at rising alpha,
      # which reads on a light page and a dark one alike; the snake is a mid
      # amber dark enough for white backgrounds and light enough for black.
      - name: Generate the snake SVG
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=%23B87514&color_dots=%2300000000,%23E8A33D40,%23E8A33D80,%23E8A33DC0,%23E8A33D

      - name: Push the SVG to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
