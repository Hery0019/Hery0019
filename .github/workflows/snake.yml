name: Generate Snake Animation

on:
  schedule:
    # Every 12 hours
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # The colours match the README banner: a warm amber snake over a dark grey ramp,
      # so the contribution grid reads as part of the same terminal.
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%2308090B&color_dots=%23EBEDF0,%23F5DFB0,%23E8A33D,%23B87514,%237A4C0C
            dist/github-contribution-grid-snake-dark.svg?color_snake=%23F0F3F6&color_dots=%23161B22,%234A3410,%238A5E12,%23C98A1E,%23E8A33D

      - name: Push SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
