<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 150" width="140" height="150" role="img" aria-labelledby="title desc">
  <title id="title">Waving robot</title>
  <desc id="desc">A small blue robot floating and waving hello.</desc>
  <style>
    :root {
      --robot: #c0d9e8;
      --panel: #142832;
      --panel-soft: #243c49;
      --metal: #819caa;
      --shine: #f0f7fb;
      --eye: #daf5ff;
    }

    .shadow {
      transform-origin: 70px 137px;
      animation: robot-shadow 3.2s ease-in-out infinite;
    }

    .float {
      transform-origin: 70px 80px;
      animation: robot-float 3.2s ease-in-out infinite;
    }

    .head {
      transform-origin: 70px 78px;
      animation: robot-look 6s ease-in-out infinite;
    }

    .arm {
      transform-origin: 94px 88px;
      animation: robot-wave 4.5s ease-in-out infinite;
    }

    .eyes {
      transform-box: fill-box;
      transform-origin: center;
      animation: robot-blink 6.7s linear infinite;
    }

    @keyframes robot-float {
      0%, 100% { transform: translate(0) rotate(-3deg); }
      50% { transform: translate(4px, -12px) rotate(4deg); }
    }

    @keyframes robot-look {
      0%, 25%, 65%, 100% { transform: rotate(0); }
      35%, 50% { transform: rotate(-10deg); }
    }

    @keyframes robot-wave {
      0%, 28%, 60%, 100% { transform: rotate(0); }
      35%, 47% { transform: rotate(24deg); }
      41%, 53% { transform: rotate(-16deg); }
    }

    @keyframes robot-blink {
      0%, 42%, 46%, 72%, 76%, 100% { transform: scaleY(1); }
      44%, 74% { transform: scaleY(.1); }
    }

    @keyframes robot-shadow {
      0%, 100% { transform: scaleX(1); opacity: .12; }
      50% { transform: scaleX(.75); opacity: .06; }
    }

    @media (prefers-reduced-motion: reduce) {
      .shadow,
      .float,
      .head,
      .arm,
      .eyes {
        animation: none;
      }
    }
  </style>

  <ellipse class="shadow" cx="70" cy="137" rx="25" ry="3" fill="var(--robot)" opacity=".12"/>
  <g class="float" stroke-linejoin="round" stroke-linecap="round">
    <ellipse cx="70" cy="120" rx="12" ry="5" fill="var(--robot)" opacity=".12"/>
    <path d="m64 113 3 8h6l3-8" fill="var(--robot)"/>
    <path d="M48 89c-12 0-17 10-13 16 3 4 9-2 14-9" fill="var(--metal)" stroke="var(--robot)" stroke-width="1.5"/>
    <g class="arm">
      <path d="M92 91c13 1 21-13 17-20-4-6-10 7-18 10" fill="var(--metal)" stroke="var(--robot)" stroke-width="1.5"/>
      <path d="m103 77 4-4" stroke="#edf5f8" stroke-width="2"/>
    </g>
    <path d="M48 82h44v13c0 13-10 21-22 21S48 108 48 95Z" fill="var(--robot)"/>
    <path d="M52 99c5 10 22 16 34 4-3 9-10 13-16 13-9 0-16-6-18-17" fill="var(--metal)"/>
    <rect x="62" y="87" width="16" height="18" rx="8" fill="var(--panel-soft)"/>
    <circle cx="70" cy="94" r="3" fill="#eaf7ff"/>
    <path d="M68 100h4" stroke="var(--metal)" stroke-width="2"/>
    <g class="head">
      <path d="m91 34 7-12" stroke="var(--metal)" stroke-width="3"/>
      <circle cx="99" cy="20" r="4" fill="var(--robot)"/>
      <rect x="27" y="46" width="14" height="24" rx="7" fill="var(--metal)"/>
      <rect x="99" y="46" width="14" height="24" rx="7" fill="var(--metal)"/>
      <path d="M32 53c0-19 15-28 38-28s38 9 38 28v8c0 18-15 25-38 25S32 79 32 61Z" fill="var(--robot)"/>
      <path d="M43 37c7-5 16-6 25-6" stroke="var(--shine)" stroke-width="3"/>
      <rect x="39" y="43" width="62" height="33" rx="16.5" fill="var(--panel)"/>
      <path d="M49 49h15" stroke="#3b5665" stroke-width="2"/>
      <g class="eyes" stroke="var(--eye)" stroke-width="3.5">
        <path d="M52 60q4-7 8 0"/>
        <path d="M80 60q4-7 8 0"/>
      </g>
      <path d="M67 67q3 3 6 0" stroke="var(--robot)" stroke-width="1.5"/>
    </g>
  </g>
</svg>
